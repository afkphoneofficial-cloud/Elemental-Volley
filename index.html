<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07060c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Elemental Volley : Spike It !!</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/icons/favicon-48.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=local179" />
  <style>
    #boot-splash{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:#fff4dc;font-family:Kanit,Segoe UI,sans-serif;color:#3a2418}
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="boot-card">
      <div class="boot-net" aria-hidden="true"></div>
      <p class="boot-kicker">ELEMENTAL VOLLEY</p>
      <h1>SPIKE IT !!</h1>
      <p id="boot-line">กำลังอุ่นตาข่าย…</p>
      <div class="boot-track"><div id="boot-fill"></div></div>
      <p id="boot-pct">4%</p>
    </div>
  </div>
  <script>
    (function () {
      var fill = document.getElementById("boot-fill");
      var pct = document.getElementById("boot-pct");
      var n = 0.04;
      window.__evBootSet = function (v) {
        n = Math.max(n, Math.min(1, v));
        if (fill) fill.style.width = Math.round(n * 100) + "%";
        if (pct) pct.textContent = Math.round(n * 100) + "%";
      };
      window.setInterval(function () {
        if (window.__evBootLock) return;
        if (n < 0.14) window.__evBootSet(n + 0.008);
      }, 220);
    })();
  </script>
  <canvas id="lobby-bg" aria-hidden="true"></canvas>
  <div id="lobby-veil" aria-hidden="true"></div>
  <canvas id="lobby-fg" aria-hidden="true"></canvas>
  <div id="vol-dock">
    <span class="vol-ico" data-i18n="web.music">♪ เพลง</span>
    <div id="vol-steps" role="group" aria-label="music volume">
      <button type="button" data-vol-step="0" aria-label="0"></button>
      <button type="button" data-vol-step="1" aria-label="1"></button>
      <button type="button" data-vol-step="2" aria-label="2"></button>
      <button type="button" data-vol-step="3" aria-label="3"></button>
    </div>
  </div>
  <div id="lang-dock">
    <button type="button" data-lang="th">ไทย</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <div id="auth-overlay" hidden>
    <div class="auth-card">
      <p id="auth-msg"></p>
      <div id="auth-google-panel">
        <div id="google-btn"></div>
        <p class="auth-note" data-i18n="web.authNote">รับเฉพาะบัญชี Gmail</p>
      </div>
      <form id="auth-name-form" class="auth-name-panel" hidden>
        <div id="auth-name-panel">
          <input id="auth-name-input" maxlength="12" data-i18n-placeholder="web.authName" placeholder="ชื่อบัญชีในเกม" autocomplete="nickname" />
          <button type="submit" data-i18n="web.authSave">บันทึกชื่อ</button>
        </div>
      </form>
    </div>
  </div>
  <div id="board-overlay" hidden>
    <div class="board-shell">
      <header class="board-head">
        <button type="button" id="board-close">กลับ</button>
        <div>
          <h2 id="board-title">กระดาน 100 อันดับ</h2>
          <p id="board-sub">จัดจากแต้มสนามบนเซิร์ฟ</p>
        </div>
      </header>
      <p id="board-note"></p>
      <div id="board-list"></div>
      <footer id="board-you" hidden></footer>
    </div>
  </div>
  <div id="exhibit-overlay" hidden>
    <div class="choice-card">
      <p class="choice-kicker">Exhibition</p>
      <p id="exhibit-msg"></p>
      <div class="choice-actions">
        <button type="button" id="exhibit-yes" class="choice-btn yes">ยอมรับ</button>
        <button type="button" id="exhibit-no" class="choice-btn no">ปฏิเสธ</button>
      </div>
    </div>
  </div>
  <div id="friend-overlay" hidden>
    <div class="auth-card">
      <p id="friend-msg"></p>
      <input id="friend-name" maxlength="16" autocomplete="off" />
      <div class="friend-actions">
        <button type="button" id="friend-add">เพิ่มเพื่อน</button>
        <button type="button" id="friend-cancel">กลับ</button>
      </div>
    </div>
  </div>
  <div id="rename-overlay" hidden>
    <div class="auth-card">
      <p id="rename-msg"></p>
      <input id="rename-input" maxlength="12" autocomplete="nickname" />
      <div class="friend-actions">
        <button type="button" id="rename-ok">บันทึกชื่อ</button>
        <button type="button" id="rename-cancel">ปิด</button>
      </div>
    </div>
  </div>
  <div id="chat-dock" hidden>
    <button type="button" id="chat-toggle">แชท</button>
    <div id="chat-panel">
      <div class="chat-tabs">
        <button type="button" id="chat-tab-world">เซิร์ฟ</button>
        <button type="button" id="chat-tab-friends">เพื่อน</button>
      </div>
      <div id="chat-friends" hidden></div>
      <div id="chat-log"></div>
      <p id="chat-note"></p>
      <form id="chat-form">
        <input id="chat-input" maxlength="180" autocomplete="off" />
        <button type="submit">ส่ง</button>
      </form>
    </div>
  </div>
  <div id="online-chip" hidden>
    <span class="online-ico" aria-hidden="true"></span>
    <span id="online-label">ออนไลน์ 1 คน</span>
  </div>
  <div id="wrap">
    <div id="game"></div>
    <div id="touch-pad" hidden>
      <div id="stick-base" aria-label="move">
        <div id="stick-knob"></div>
        <span class="pad-lab" data-i18n="touch.move">เดิน</span>
      </div>
      <button type="button" id="hit-pad" aria-label="hit">
        <span class="hit-core"></span>
        <span class="pad-lab" data-i18n="touch.hit">ตบ</span>
      </button>
    </div>
    <div id="rotate-hint" hidden>
      <p data-i18n="touch.rotate">หมุนจอเป็นแนวนอนจะเล่นง่ายกว่า  ·  แตะเพื่อปิด</p>
    </div>
  </div>
  <footer id="site-foot">
    <span class="foot-copy">© 2026</span>
    <span class="foot-dot" aria-hidden="true">·</span>
    <span class="foot-by">Powered by</span>
    <a class="foot-brand" href="https://afkphone.com" target="_blank" rel="noopener noreferrer">afkphone</a>
  </footer>
  <audio id="ev-bgm" autoplay playsinline preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="js/main.js?v=local199"></script>
</body>
</html>
